name: GA Opportunities

# Pulls current GA government bid opportunities (interior design/
# architecture, furniture acquisition) from the Georgia Procurement
# Registry's public search endpoint — no login, no API key, so this
# reuses the same two secrets the backup pipeline already has. Runs
# Monday/Wednesday/Friday mornings; workflow_dispatch allows a manual
# on-demand refresh.
on:
  schedule:
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Fetch GA opportunities
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fetch-ga-opportunities.ts
