name: Weekly Backup

# Runs every 15 minutes and exits immediately unless it's actually the
# Saturday 4:00 AM America/New_York window (see src/lib/backup/cycle.ts) —
# GitHub Actions cron is UTC-only and DST would silently shift a fixed UTC
# schedule by an hour twice a year, so the timezone-correct check happens
# inside the script instead, using real IANA timezone data on every run.
# workflow_dispatch lets the app's "Backup Now" button (POST /api/backups)
# trigger an on-demand run, passing which system_backups row to update.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backup_id:
        description: "Existing system_backups row id to update (manual runs only)"
        required: false
      backup_type:
        description: "scheduled or manual"
        required: false
        default: "manual"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Generate backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_TYPE: ${{ github.event.inputs.backup_type || 'scheduled' }}
          BACKUP_ID: ${{ github.event.inputs.backup_id || '' }}
        run: npx tsx scripts/generate-backup.ts
