name: Weekly Market Intelligence Update

# One consolidated Monday-morning run: refreshes the GA/FL bid registries
# (Opportunity Radar) and discovers Commercial BD Targets + Public-Sector/
# Institutional Pipeline leads via Tavily search + Claude extraction.
# Replaces the old GA-only Mon/Wed/Fri schedule — this module is a curated
# weekly snapshot, not a continuously-changing feed.
on:
  schedule:
    - cron: "0 12 * * 1" # 8:00 AM America/New_York (EST, UTC-4 in summer — see note below)
  workflow_dispatch:

jobs:
  market-intel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # @supabase/supabase-js's realtime client requires Node's native
      # WebSocket global (stable from Node 22) — createClient() throws
      # synchronously on Node 20, before this script's logic even runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run weekly market intelligence update
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/weekly-market-intel.ts
